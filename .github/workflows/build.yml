# Cache reusing
# Workflow runs can restore caches created in either the current branch or the default branch
# More cache restrictions:
#   * https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache

name: Build

on: 
  workflow_call:
    inputs:
      projectName:
        required: true
        type: string
      projectPath:
        required: false
        default: ./
        type: string

jobs:
  build-all-target-platforms:
    name: ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Names as specified in Unity - https://docs.unity3d.com/ScriptReference/BuildTarget
        targetPlatform:
          - Android
          - StandaloneWindows64
          - WebGL

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore library cache
        uses: actions/cache@v6
        with:
          path: ${{ inputs.projectPath }}/Library
          key: Library-${{ runner.os }}-${{ matrix.targetPlatform }}-${{ hashFiles('**/ProjectSettings/ProjectVersion.txt', '**/Packages/packages-lock.json') }}

      - name: Restore NuGet packages
        run: |
          dotnet tool install --global NuGetForUnity.Cli --version 4.5.0
          nugetforunity restore ${{ inputs.projectPath }}

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Verify Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ inputs.projectPath }}
          buildName: ${{ inputs.projectName }}
          targetPlatform: ${{ matrix.targetPlatform }}
          unityVersion: auto

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.projectName }}${{ matrix.targetPlatform }} 
          path: build/${{ matrix.targetPlatform }}
